name: Android CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

permissions:
  contents: read

# Avoid concurrent Gradle dependency downloads from rapid pushes to the same branch.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests and build APKs
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease

      # Lint is diagnostic until the existing project-wide backlog is cleaned.
      # Keep the full report visible, but don't block APKs/tests on pre-existing findings.
      - name: Run Android Lint report
        continue-on-error: true
        run: |
          lint_status=0
          gradle --no-daemon lintRelease || lint_status=$?
          report="app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt"
          if [ -f "$report" ]; then
            echo "===== FULL ANDROID LINT REPORT ====="
            cat "$report"
          else
            echo "Android Lint did not produce its text report."
          fi
          exit "$lint_status"

      - name: Upload Android Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Squirtify-lint-report
          path: |
            app/build/reports/lint-results-release.*
            app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Squirtify-debug-1.7.4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Squirtify-release-unsigned-1.7.4
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
